<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lionel Messi — Tribute Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Work Sans', sans-serif;
    background: #F5F0E1;
    color: #1A2744;
    overflow: hidden;
    background-image:
      repeating-linear-gradient(transparent, transparent 19px, rgba(140,160,185,0.15) 19px, rgba(140,160,185,0.15) 20px),
      linear-gradient(90deg, transparent 49px, rgba(200,80,80,0.18) 49px, rgba(200,80,80,0.18) 51px, transparent 51px);
    background-size: 100% 20px, 100% 100%;
  }

  .w {
    max-width: 100%;
    padding: 1.2rem 1.5rem 1rem 3.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 200px;
    position: relative;
  }

  .w__date {
    font-family: 'Caveat', cursive;
    font-size: 0.85rem;
    color: #3D7AB5;
    font-weight: 500;
    margin-bottom: 0.15rem;
  }

  .w__name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    line-height: 0.95;
    letter-spacing: 0.01em;
    margin-bottom: 0.15rem;
  }

  .w__sub {
    font-family: 'Caveat', cursive;
    font-size: 1rem;
    color: #3D7AB5;
    font-weight: 500;
    margin-bottom: 0.6rem;
  }

  .w__stats {
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    margin-bottom: 0.6rem;
  }

  .w__stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    line-height: 1;
    color: #1A2744;
  }

  .w__stat-label {
    font-size: 0.6rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #2C3E50;
    opacity: 0.45;
  }

  .w__note {
    font-family: 'Caveat', cursive;
    font-size: 0.8rem;
    color: #2C3E50;
    opacity: 0.45;
    line-height: 1.3;
  }

  .w__note a {
    color: #3D7AB5;
    text-decoration: none;
    opacity: 1;
  }

  .w__note a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="w">
  <p class="w__date">August 31, 2026</p>
  <h1 class="w__name">Lionel Messi</h1>
  <p class="w__sub">Gracias, Argentina</p>
  <div class="w__stats">
    <div>
      <div class="w__stat-num">927</div>
      <div class="w__stat-label">Goals</div>
    </div>
    <div>
      <div class="w__stat-num">460</div>
      <div class="w__stat-label">Assists</div>
    </div>
    <div>
      <div class="w__stat-num">47</div>
      <div class="w__stat-label">Trophies</div>
    </div>
    <div>
      <div class="w__stat-num">8</div>
      <div class="w__stat-label">Ballons d'Or</div>
    </div>
    <div>
      <div class="w__stat-num">125</div>
      <div class="w__stat-label">Argentina Goals</div>
    </div>
  </div>
  <p class="w__note">A tribute to the most decorated international career in football history · <a href="messi-tribute.html" target="_blank" rel="noopener">full tribute →</a></p>
</div>
</body>
</html>
